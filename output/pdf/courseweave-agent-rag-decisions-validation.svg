<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<rect x="0" y="0" width="1800" height="1200" rx="0" fill="#F5F6F1" stroke="none" stroke-width="1"/>
<text x="56" y="39.68" font-family="Microsoft YaHei" font-size="12" font-weight="700" fill="#237E6C">COURSEWEAVE  /  ARCHITECTURE NOTES</text>
<text x="56" y="90.82" font-family="SimSun" font-size="38" font-weight="400" fill="#183B34">为什么这样设计，如何证明有效</text>
<text x="58" y="122.24" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#65746B">把检索质量、执行可靠性与教学效果分开验证；每个结论对应一类证据。</text>
<rect x="1450" y="48" width="294" height="30" rx="6" fill="#153D34" stroke="none" stroke-width="1"/>
<text x="1462" y="67.46000000000001" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#FFFFFF">02 / 02   选型与验证</text>
<text x="56" y="191.47" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#183B34">四个关键选择</text>
<text x="1100" y="191.47" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#183B34">三层验证，不能互相替代</text>
<rect x="56" y="213" width="990" height="154" rx="12" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="1"/>
<rect x="76" y="231" width="48" height="30" rx="6" fill="#153D34" stroke="none" stroke-width="1"/>
<text x="88" y="250.46" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#FFFFFF">01</text>
<text x="140" y="251.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#183B34">有限动作的单 Agent：反馈决定下一步</text>
<text x="140" y="284.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">用有限动作让模型按缺项调整，用严格 JSON 兼容现有模型 API。服务端限制范围、预算与副作用，控制器保持可读、可测。</text>
<text x="140" y="332.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#65746B">替代：固定流程顺序可预测但适应性弱；多 Agent / 状态图框架扩展强，但增加协调维护成本。</text>
<text x="140" y="354.968" font-family="Microsoft YaHei" font-size="11.2" font-weight="700" fill="#237E6C">验证理由：必须验证真实控制器会接收失败反馈并修订，而非只出现“反思”文案。</text>
<rect x="56" y="385" width="990" height="154" rx="12" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="1"/>
<rect x="76" y="403" width="48" height="30" rx="6" fill="#153D34" stroke="none" stroke-width="1"/>
<text x="88" y="422.46" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#FFFFFF">02</text>
<text x="140" y="423.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#183B34">保留 RAG 方法，用适配器形成工具边界</text>
<text x="140" y="456.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">复用已有检索、融合和引用逻辑，先隔离 Agent 编排带来的变化；内部调用部署简单，需要时再切 HTTP。</text>
<text x="140" y="504.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#65746B">替代：重写检索难隔离收益；立即拆微服务增加网络、运维和来源 ID 映射成本。</text>
<text x="140" y="526.968" font-family="Microsoft YaHei" font-size="11.2" font-weight="700" fill="#237E6C">验证理由：原 RAG 三个核心文件无差异；用伪造、越界、空白、跨书章节数据检验来源边界。</text>
<rect x="56" y="557" width="990" height="154" rx="12" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="1"/>
<rect x="76" y="575" width="48" height="30" rx="6" fill="#153D34" stroke="none" stroke-width="1"/>
<text x="88" y="594.46" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#FFFFFF">03</text>
<text x="140" y="595.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#183B34">JSON 检查点 + 单 worker + 快照 CAS</text>
<text x="140" y="628.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">复用 SQLite 保存轨迹、预算和稿件。回答、停止与续跑比较最新快照，防止旧响应覆盖刚保存的成果。</text>
<text x="140" y="676.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#65746B">替代：纯内存无法可靠恢复；分布式队列 / 状态版本适合扩容，但需租约、迁移与幂等设计。</text>
<text x="140" y="698.968" font-family="Microsoft YaHei" font-size="11.2" font-weight="700" fill="#237E6C">验证理由：正常演示看不出竞态；需中断、取消、Q1→Q2、快速续跑交接的故障注入。</text>
<rect x="56" y="729" width="990" height="154" rx="12" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="1"/>
<rect x="76" y="747" width="48" height="30" rx="6" fill="#153D34" stroke="none" stroke-width="1"/>
<text x="88" y="766.46" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#FFFFFF">04</text>
<text x="140" y="767.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#183B34">本地交付检查 + 教师最终判断</text>
<text x="140" y="800.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">来源、教材覆盖、课时和结构有可解释规则；语义正确与课堂适用性交给教师。自动稿与教师稿分离保护。</text>
<text x="140" y="848.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#65746B">替代：模型自评容易复用同一错误；增加模型裁判仍需人工标注校准，不能直接替代教师。</text>
<text x="140" y="870.968" font-family="Microsoft YaHei" font-size="11.2" font-weight="700" fill="#237E6C">验证理由：finish 必须重验最新稿；保存稿、来源漂移和撤除模型配置均有回归。</text>
<rect x="1100" y="213" width="644" height="181" rx="12" fill="#153D34" stroke="none" stroke-width="1"/>
<text x="1124" y="246.91" font-family="Microsoft YaHei" font-size="19" font-weight="700" fill="#FFFFFF">01  工程可靠性</text>
<text x="1530" y="245.68" font-family="Microsoft YaHei" font-size="12" font-weight="400" fill="#FFFFFF">本轮 · 2026-10-28</text>
<text x="1124" y="302.6" font-family="Microsoft YaHei" font-size="40" font-weight="700" fill="#FFFFFF">310</text>
<text x="1215" y="298.46" font-family="Microsoft YaHei" font-size="14" font-weight="400" fill="#FFFFFF">后端</text>
<text x="1305" y="302.6" font-family="Microsoft YaHei" font-size="40" font-weight="700" fill="#FFFFFF">83</text>
<text x="1371" y="298.46" font-family="Microsoft YaHei" font-size="14" font-weight="400" fill="#FFFFFF">前端测试通过</text>
<text x="1124" y="336.57" font-family="Microsoft YaHei" font-size="13" font-weight="400" fill="#FFFFFF">隔离数据库、脚本决策、真实控制器、并发故障注入；构建与浏览器验收。</text>
<text x="1124" y="358.57" font-family="Microsoft YaHei" font-size="13" font-weight="400" fill="#FFFFFF">独立复核另跑其中 45 项：属于 310 项子集，不能重复相加。</text>
<text x="1124" y="384.235" font-family="Microsoft YaHei" font-size="11.5" font-weight="400" fill="#FFFFFF">能证明：控制、来源、状态约束；不能证明：真实模型稳定选对工具。</text>
<rect x="1100" y="413" width="644" height="290" rx="12" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="1"/>
<text x="1124" y="448.91" font-family="Microsoft YaHei" font-size="19" font-weight="700" fill="#183B34">02  检索质量</text>
<text x="1430" y="447.68" font-family="Microsoft YaHei" font-size="12" font-weight="400" fill="#65746B">历史固定回归 · 2026-09-24</text>
<text x="1124" y="492.47" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#536C95">420 题 · 7 本教材 · 137 章</text>
<text x="1124" y="519.57" font-family="Microsoft YaHei" font-size="13" font-weight="400" fill="#65746B">100 人工核心题 + 320 脚本扩展题；直接调用生产 retrieve</text>
<polyline points="1124,538 1720,538" fill="none" stroke="#CDD8D0" stroke-width="1" stroke-linejoin="round"/>
<text x="1124" y="566.46" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#183B34">知识点覆盖命中 @8</text>
<text x="1520" y="568.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#536C95">380 / 380</text>
<text x="1124" y="601.46" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#183B34">引用候选相关及页码有效 @3</text>
<text x="1520" y="603.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#536C95">86.86%</text>
<text x="1520" y="625.79" font-family="Microsoft YaHei" font-size="11" font-weight="400" fill="#65746B">985 / 1134 条</text>
<text x="1124" y="638.015" font-family="Microsoft YaHei" font-size="13.5" font-weight="400" fill="#183B34">跨书覆盖 41 / 41；域外拒答 40 / 40</text>
<text x="1124" y="664.235" font-family="Microsoft YaHei" font-size="11.5" font-weight="400" fill="#65746B">@8 为 rubric 覆盖门槛（多项知识≥60%），非逐 gold chunk 召回；@3 为相关及页码规则，非语义正确率。历史</text>
<text x="1124" y="682.235" font-family="Microsoft YaHei" font-size="11.5" font-weight="400" fill="#65746B">报告，本轮未重跑。</text>
<rect x="1100" y="722" width="644" height="161" rx="12" fill="#FBF1DD" stroke="none" stroke-width="1"/>
<text x="1124" y="756.91" font-family="Microsoft YaHei" font-size="19" font-weight="700" fill="#183B34">03  教学效果与真实模型策略</text>
<rect x="1622" y="737" width="98" height="28" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1634" y="754.68" font-family="Microsoft YaHei" font-size="12" font-weight="700" fill="#AF7D32">待验证</text>
<text x="1124" y="792.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">真实模型能否稳定补查？引用是否支持结论？</text>
<text x="1124" y="817.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">教案是否适合学情，能否减少教师的备课时间？</text>
<text x="1124" y="860.68" font-family="Microsoft YaHei" font-size="12" font-weight="400" fill="#AF7D32">需要独立任务集、教师盲评与对照实验，不能拿测试数量代替。</text>
<rect x="56" y="929" width="1688" height="190" rx="12" fill="#E7F1E9" stroke="none" stroke-width="1"/>
<text x="80" y="965.69" font-family="Microsoft YaHei" font-size="21" font-weight="700" fill="#183B34">下一步怎样评 Agent，为什么这样评</text>
<text x="80" y="1007.13" font-family="Microsoft YaHei" font-size="17" font-weight="700" fill="#237E6C">01  固定数据版本</text>
<text x="80" y="1035.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#183B34">教材、任务、rubric 与哈希</text>
<polyline points="454,1003 483,1003" fill="none" stroke="#237E6C" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="483,1003 475.9040406177657,1006.6942334043318 475.9040406177657,999.3057665956682" fill="#237E6C"/>
<text x="493" y="1007.13" font-family="Microsoft YaHei" font-size="17" font-weight="700" fill="#237E6C">02  同条件对照</text>
<text x="493" y="1035.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#183B34">固定流程 vs Agent；同 RAG / 模型</text>
<polyline points="867,1003 896,1003" fill="none" stroke="#237E6C" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="896,1003 888.9040406177658,1006.6942334043318 888.9040406177658,999.3057665956682" fill="#237E6C"/>
<text x="906" y="1007.13" font-family="Microsoft YaHei" font-size="17" font-weight="700" fill="#237E6C">03  教师双人盲评</text>
<text x="906" y="1035.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#183B34">语义支持、完成度、课堂适用</text>
<polyline points="1280,1003 1309,1003" fill="none" stroke="#237E6C" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="1309,1003 1301.9040406177658,1006.6942334043318 1301.9040406177658,999.3057665956682" fill="#237E6C"/>
<text x="1319" y="1007.13" font-family="Microsoft YaHei" font-size="17" font-weight="700" fill="#237E6C">04  记录成本与效率</text>
<text x="1319" y="1035.125" font-family="Microsoft YaHei" font-size="12.5" font-weight="400" fill="#183B34">改稿时间、调用费用、p50 / p95</text>
<text x="80" y="1075.35" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#183B34">为什么：控制检索与模型的混杂因素，区分“工程能运行”和“教学有收益”；盲评减少主观偏差，版本与轨迹便于复现。</text>
<text x="80" y="1102.68" font-family="Microsoft YaHei" font-size="12" font-weight="400" fill="#65746B">边界：当前为单 worker、JSON 检查点、协作式取消；不承诺分布式扩容、外部调用 exactly-once 或语义零幻觉。</text>
<polyline points="56,1151 1744,1151" fill="none" stroke="#CDD8D0" stroke-width="1" stroke-linejoin="round"/>
<text x="56" y="1175.345" font-family="Microsoft YaHei" font-size="10.5" font-weight="400" fill="#65746B">依据：Agent架构技术复盘；agent-v3-engineering-validation-20261028；teacher-benchmark-v3（历史检索报告，非新 Agent 效果分）。</text>
<text x="1512" y="1174.68" font-family="Microsoft YaHei" font-size="12" font-weight="700" fill="#237E6C">2026-10-29  /  02</text>
</svg>